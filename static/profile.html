<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="YouInsight AI - 个人中心与资产大盘">
  <title>YouInsight AI - 个人中心与资产大盘</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    .prof-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      transition: all 0.2s;
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
    }
    .prof-nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }
    .prof-nav-item.active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.15));
      border-color: rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body class="bg-[var(--surface-primary)] text-[var(--text-primary)] min-h-screen flex flex-col antialiased">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-40 bg-[var(--surface-secondary)]/90 backdrop-blur-xl border-b border-[var(--border-subtle)] px-4 sm:px-6 py-3">
    <div class="flex items-center justify-between max-w-7xl mx-auto">
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-md">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <div>
            <h1 class="font-display text-white text-base font-bold">YouInsight AI</h1>
            <p class="text-[11px] text-[var(--text-muted)]">用户个人中心与资产大盘</p>
          </div>
        </a>
      </div>

      <div class="flex items-center gap-3">
        <a href="index.html" class="btn-secondary text-xs py-1.5 px-3 flex items-center gap-1.5 text-indigo-300 hover:text-white">
          <span>←</span><span>返回研报工作台</span>
        </a>
        <button onclick="handleLogout()" class="text-xs text-rose-400 hover:text-rose-300 py-1.5 px-2.5 rounded hover:bg-rose-500/10 transition-colors">
          退出登录
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex max-w-7xl mx-auto w-full p-4 sm:p-6 gap-6">
    <!-- Left Sidebar: Profile Card & Navigation -->
    <aside class="w-64 flex-shrink-0 flex flex-col gap-4">
      <!-- User Profile Card -->
      <div class="card p-5 text-center relative overflow-hidden">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-2xl font-bold text-white shadow-xl shadow-indigo-500/25 mb-3">
          <span id="user-avatar-initial">U</span>
        </div>
        <h2 id="card-username" class="font-bold text-white text-base mb-1">加载中...</h2>
        <div id="card-role-badge" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-indigo-500/20 text-indigo-300 mb-3">
          正式会员
        </div>
        <div class="text-[11px] text-[var(--text-muted)] border-t border-white/5 pt-2">
          UID: <span id="card-uid" class="font-mono text-slate-300">#—</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="space-y-1.5">
        <button onclick="switchTab('overview')" id="nav-overview" class="prof-nav-item active">
          <span>📊</span><span>账户概览与配额</span>
        </button>
        <button onclick="switchTab('reports')" id="nav-reports" class="prof-nav-item">
          <span>📚</span><span>我的研报资产库</span>
        </button>
        <button onclick="switchTab('security')" id="nav-security" class="prof-nav-item">
          <span>⚙️</span><span>账号资料与安全</span>
        </button>
      </nav>
    </aside>

    <!-- Right Content Area -->
    <section class="flex-1 min-w-0">
      
      <!-- ================= TAB 1: 账户概览与配额 ================= -->
      <div id="tab-overview" class="space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="card p-5 bg-gradient-to-br from-indigo-950/40 to-slate-900 border-indigo-500/30">
            <p class="text-xs text-indigo-300 font-medium mb-1">⚡ 今日剩余可用额度</p>
            <h3 id="stat-remaining" class="text-3xl font-black text-emerald-400 font-mono">0 次</h3>
            <p class="text-[11px] text-[var(--text-muted)] mt-2">每日 00:00 自动重置刷新</p>
          </div>
          <div class="card p-5 bg-gradient-to-br from-purple-950/40 to-slate-900 border-purple-500/30">
            <p class="text-xs text-purple-300 font-medium mb-1">📑 累计已生成研报</p>
            <h3 id="stat-total-created" class="text-3xl font-black text-white font-mono">0 篇</h3>
            <p class="text-[11px] text-[var(--text-muted)] mt-2">支持多端云端漫游</p>
          </div>
          <div class="card p-5 bg-gradient-to-br from-pink-950/40 to-slate-900 border-pink-500/30">
            <p class="text-xs text-pink-300 font-medium mb-1">👑 账户等级与权限</p>
            <h3 id="stat-plan-name" class="text-xl font-bold text-white mt-1.5">标准版会员</h3>
            <p id="stat-plan-quota" class="text-[11px] text-pink-300 mt-2 font-mono">10 次 / 每天</p>
          </div>
        </div>

        <!-- Quota Usage Detail Card -->
        <div class="card p-6">
          <h3 class="font-bold text-white text-sm mb-4 flex items-center gap-2">
            <span>📊</span><span>今日配额消耗进度</span>
          </h3>
          <div class="space-y-3">
            <div class="flex justify-between text-xs">
              <span class="text-[var(--text-muted)]">今日消耗进度: <span id="text-used-detail" class="text-white font-mono">0 / 10</span></span>
              <span id="text-percent" class="text-indigo-400 font-mono font-bold">0%</span>
            </div>
            <div class="w-full h-3 rounded-full bg-[var(--surface-tertiary)] overflow-hidden border border-white/5">
              <div id="quota-progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 rounded-full transition-all duration-500" style="width: 0%;"></div>
            </div>
            <p class="text-[11px] text-[var(--text-muted)]">
              💡 提示：所有正式注册用户每日均享有 10 次免费深度研报与早报额度。如需更多批量额度，可联系管理员调配。
            </p>
          </div>
        </div>
      </div>

      <!-- ================= TAB 2: 我的研报资产库 ================= -->
      <div id="tab-reports" class="space-y-4 hidden">
        <div class="flex items-center justify-between gap-3">
          <input type="text" id="report-search" class="input-field text-xs flex-1" placeholder="🔍 搜索我的研报标题与课题..." oninput="filterReports()">
          <button onclick="loadUserReports()" class="btn-secondary text-xs py-2 px-4 whitespace-nowrap">🔄 刷新</button>
        </div>

        <div id="reports-list-container" class="space-y-3">
          <p class="text-xs text-[var(--text-muted)] text-center py-8">正在加载研报资产...</p>
        </div>
      </div>

      <!-- ================= TAB 3: 账号资料与安全中心 ================= -->
      <div id="tab-security" class="space-y-6 hidden">
        <!-- 1. 修改用户名 -->
        <div class="card p-6 max-w-xl space-y-4">
          <h3 class="font-bold text-white text-sm pb-2 border-b border-white/5 flex items-center gap-2">
            <span>👤</span><span>个性化资料</span>
          </h3>
          <div class="space-y-1.5">
            <label class="block text-xs text-[var(--text-muted)]">个性昵称 / 用户名</label>
            <div class="flex gap-2">
              <input type="text" id="input-edit-username" class="input-field text-xs flex-1" placeholder="新用户名">
              <button onclick="updateUsername()" class="btn-primary text-xs px-4 py-2">保存修改</button>
            </div>
          </div>
        </div>

        <!-- 2. 修改密码 -->
        <div class="card p-6 max-w-xl space-y-4">
          <h3 class="font-bold text-white text-sm pb-2 border-b border-white/5 flex items-center gap-2">
            <span>🔒</span><span>修改登录密码</span>
          </h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs text-[var(--text-muted)] mb-1">新登录密码 (≥6位)</label>
              <input type="password" id="input-new-pw" class="input-field text-xs w-full" placeholder="输入新密码">
            </div>
            <div>
              <label class="block text-xs text-[var(--text-muted)] mb-1">确认新密码</label>
              <input type="password" id="input-confirm-pw" class="input-field text-xs w-full" placeholder="再次输入新密码">
            </div>
            <button onclick="updatePassword()" class="btn-secondary text-xs px-4 py-2 text-indigo-300 hover:text-white">
              确认修改密码
            </button>
          </div>
        </div>

        <!-- 3. 绑定状态 -->
        <div class="card p-6 max-w-xl space-y-3">
          <h3 class="font-bold text-white text-sm pb-2 border-b border-white/5 flex items-center gap-2">
            <span>📱</span><span>账号绑定情况</span>
          </h3>
          <div class="space-y-2 text-xs">
            <div class="flex justify-between p-3 rounded-xl bg-[var(--surface-tertiary)] border border-[var(--border-subtle)]">
              <span class="text-[var(--text-muted)]">绑定手机号:</span>
              <span id="sec-phone" class="font-mono text-white">未绑定</span>
            </div>
            <div class="flex justify-between p-3 rounded-xl bg-[var(--surface-tertiary)] border border-[var(--border-subtle)]">
              <span class="text-[var(--text-muted)]">绑定邮箱:</span>
              <span id="sec-email" class="font-mono text-white">未绑定</span>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>
    const API_BASE = window.location.pathname.startsWith('/you-insight') ? '/you-insight' : '';
    let currentUser = null;
    let token = localStorage.getItem('youinsight_jwt_token') || null;
    let userReports = [];

    async function initProfile() {
      if (!token) {
        window.location.href = 'index.html';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) {
          localStorage.removeItem('youinsight_jwt_token');
          window.location.href = 'index.html';
          return;
        }
        const data = await res.json();
        currentUser = data.user;
        renderUserData();
        loadUserReports();
      } catch (e) {
        window.location.href = 'index.html';
      }
    }

    function renderUserData() {
      if (!currentUser) return;
      document.getElementById('user-avatar-initial').textContent = (currentUser.username || 'U')[0].toUpperCase();
      document.getElementById('card-username').textContent = currentUser.username;
      document.getElementById('card-uid').textContent = `#${currentUser.id}`;

      const roleBadge = document.getElementById('card-role-badge');
      if (currentUser.role === 'super_admin') {
        roleBadge.textContent = '👑 超级管理员';
        roleBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-500/20 text-amber-300';
      } else if (currentUser.role === 'admin') {
        roleBadge.textContent = '🛡️ 运营管理';
        roleBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-purple-500/20 text-purple-300';
      } else {
        roleBadge.textContent = '✨ 正式会员';
        roleBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-indigo-500/20 text-indigo-300';
      }

      // Stats
      const remainingEl = document.getElementById('stat-remaining');
      const planNameEl = document.getElementById('stat-plan-name');
      const planQuotaEl = document.getElementById('stat-plan-quota');
      const usedDetailEl = document.getElementById('text-used-detail');
      const percentEl = document.getElementById('text-percent');
      const progressBar = document.getElementById('quota-progress-bar');

      if (currentUser.daily_quota === -1) {
        remainingEl.textContent = '无限次';
        planNameEl.textContent = '👑 旗舰无限版';
        planQuotaEl.textContent = '无限次 / 终身可用';
        usedDetailEl.textContent = `${currentUser.used_today} / 无限`;
        percentEl.textContent = '100%';
        progressBar.style.width = '100%';
      } else {
        remainingEl.textContent = `${currentUser.remaining_today} 次`;
        planNameEl.textContent = '✨ 标准专业版';
        planQuotaEl.textContent = `${currentUser.daily_quota} 次 / 每天`;
        usedDetailEl.textContent = `${currentUser.used_today} / ${currentUser.daily_quota}`;
        const pct = Math.min(100, Math.round((currentUser.used_today / currentUser.daily_quota) * 100));
        percentEl.textContent = `${pct}% 已用`;
        progressBar.style.width = `${pct}%`;
      }

      document.getElementById('stat-total-created').textContent = `${currentUser.total_generations || 0} 篇`;

      // Security Tab
      document.getElementById('input-edit-username').value = currentUser.username;
      document.getElementById('sec-phone').textContent = currentUser.phone || '未绑定';
      document.getElementById('sec-email').textContent = currentUser.email || '未绑定';
    }

    function switchTab(tab) {
      ['overview', 'reports', 'security'].forEach(t => {
        const p = document.getElementById(`tab-${t}`);
        const n = document.getElementById(`nav-${t}`);
        if (p) p.classList.toggle('hidden', t !== tab);
        if (n) n.classList.toggle('active', t === tab);
      });
      if (tab === 'reports') loadUserReports();
    }

    async function loadUserReports() {
      try {
        const res = await fetch(`${API_BASE}/api/history?limit=100`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) return;
        const data = await res.json();
        userReports = data.data || [];
        renderReportsList(userReports);
      } catch (e) {}
    }

    function renderReportsList(items) {
      const container = document.getElementById('reports-list-container');
      if (!container) return;
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="card p-12 text-center text-xs text-[var(--text-muted)]">暂无历史研报记录，快去工作台探索吧！</div>';
        return;
      }
      container.innerHTML = items.map(r => `
        <div class="card p-4 hover:border-indigo-500/30 transition-all">
          <div class="flex items-center justify-between mb-2">
            <span class="px-2 py-0.5 rounded text-[11px] bg-indigo-500/20 text-indigo-300 font-medium">${escapeHtml(r.type)}</span>
            <span class="text-[11px] text-[var(--text-muted)] font-mono">${r.created_at}</span>
          </div>
          <h4 class="font-bold text-white text-sm mb-2">${escapeHtml(r.title)}</h4>
          <p class="text-xs text-[var(--text-secondary)] line-clamp-2 mb-3">${escapeHtml(r.excerpt || '')}</p>
          <div class="flex items-center justify-between pt-2 border-t border-white/5">
            <span class="text-[11px] text-[var(--text-muted)]">出处: 已交叉验证</span>
            <div class="flex gap-2">
              <button onclick="downloadReportDoc(${r.id})" class="btn-secondary text-[11px] py-1 px-2.5">📄 导出 Word</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterReports() {
      const q = document.getElementById('report-search')?.value.toLowerCase() || '';
      const filtered = userReports.filter(r => (r.title || '').toLowerCase().includes(q) || (r.excerpt || '').toLowerCase().includes(q));
      renderReportsList(filtered);
    }

    async function downloadReportDoc(id) {
      try {
        const res = await fetch(`${API_BASE}/api/history/${id}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const rep = data.data;
        if (!rep) return;
        const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${rep.title}</title></head><body><h1>${rep.title}</h1><div>${marked.parse(rep.content || '')}</div></body></html>`;
        const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${rep.title}_${rep.created_at.slice(0, 10)}.doc`;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast('已导出 Word 文档！', 'success');
      } catch (e) {
        showToast('导出失败', 'error');
      }
    }

    async function updateUsername() {
      const username = document.getElementById('input-edit-username')?.value.trim();
      if (!username) return;
      try {
        const res = await fetch(`${API_BASE}/api/auth/update-profile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '修改失败');
        currentUser.username = username;
        renderUserData();
        showToast('个性昵称已更新！', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function updatePassword() {
      const new_password = document.getElementById('input-new-pw')?.value;
      const confirm_password = document.getElementById('input-confirm-pw')?.value;
      if (!new_password || new_password.length < 6) {
        showToast('新密码长度至少 6 位', 'info');
        return;
      }
      if (new_password !== confirm_password) {
        showToast('两次输入的新密码不一致', 'error');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/auth/update-profile`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ new_password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || '密码修改失败');
        document.getElementById('input-new-pw').value = '';
        document.getElementById('input-confirm-pw').value = '';
        showToast('登录密码已成功修改！', 'success');
      } catch (err) { showToast(err.message, 'error'); }
    }

    function handleLogout() {
      localStorage.removeItem('youinsight_jwt_token');
      window.location.href = 'index.html';
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3200);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', initProfile);
  </script>
</body>
</html>
